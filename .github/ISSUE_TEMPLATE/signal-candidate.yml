name: Submit a signal candidate
description: Submit a specific update that may belong in Agentic Payment Daily Signal.
title: "[Signal] "
labels: ["signal-candidate", "needs-verification"]
body:
  - type: input
    id: title
    attributes:
      label: Signal title
      placeholder: "Visa releases Trusted Agent Protocol..."
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Original source URL
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: what_changed
    attributes:
      label: What changed?
      placeholder: "Describe the concrete update in 1-3 sentences."
    validations:
      required: true
  - type: textarea
    id: why_matters
    attributes:
      label: Why does it matter for Agentic Payment?
      placeholder: "Explain the connection to AI agents, payments, stablecoin rails, wallets, identity, risk, compliance, or merchant workflows."
    validations:
      required: true
  - type: input
    id: audience
    attributes:
      label: Who should care?
      placeholder: "payment founders, wallet builders, stablecoin operators..."
    validations:
      required: false
  - type: input
    id: tags
    attributes:
      label: Suggested tags
      placeholder: "agent wallet, stablecoin rails, identity, risk..."
    validations:
      required: false
